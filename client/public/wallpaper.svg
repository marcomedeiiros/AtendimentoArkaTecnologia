<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!--
    Papel de parede das conversas (estilo WhatsApp doodle).
    Fundo azul-petroleo escuro com icones em contorno sutil.
    Para trocar a cor do traco, edite a variavel do <g> abaixo.
  -->
  <rect width="360" height="360" fill="#16232B"/>
  <g fill="none" stroke="#2C4250" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- balao de conversa -->
    <g transform="translate(26,30)">
      <path d="M0 6a6 6 0 0 1 6-6h26a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H14l-8 7v-7a6 6 0 0 1-6-6z"/>
    </g>

    <!-- coracao -->
    <g transform="translate(112,24)">
      <path d="M12 22S0 14 0 6.5A6.5 6.5 0 0 1 12 3a6.5 6.5 0 0 1 12 3.5C24 14 12 22 12 22z"/>
    </g>

    <!-- camera -->
    <g transform="translate(186,26)">
      <rect x="0" y="6" width="34" height="24" rx="4"/>
      <path d="M11 6l3-5h6l3 5"/>
      <circle cx="17" cy="18" r="7"/>
    </g>

    <!-- nota musical -->
    <g transform="translate(272,22)">
      <path d="M6 26V4l16-3v22"/>
      <circle cx="3" cy="27" r="4"/>
      <circle cx="19" cy="24" r="4"/>
    </g>

    <!-- xicara de cafe -->
    <g transform="translate(30,96)">
      <path d="M0 4h26v12a9 9 0 0 1-9 9H9a9 9 0 0 1-9-9z"/>
      <path d="M26 8h4a5 5 0 0 1 0 10h-4"/>
      <path d="M6 0v-4M14 0v-4M22 0v-4"/>
    </g>

    <!-- relogio -->
    <g transform="translate(104,98)">
      <circle cx="14" cy="14" r="14"/>
      <path d="M14 6v9l6 4"/>
    </g>

    <!-- envelope -->
    <g transform="translate(176,102)">
      <rect x="0" y="0" width="36" height="24" rx="3"/>
      <path d="M0 3l18 13L36 3"/>
    </g>

    <!-- raio -->
    <g transform="translate(272,96)">
      <path d="M14 0L2 18h9l-3 14 14-19h-9z"/>
    </g>

    <!-- estrela -->
    <g transform="translate(24,168)">
      <path d="M15 0l4.6 9.6 10.4 1.5-7.5 7.4 1.8 10.5L15 24l-9.3 5 1.8-10.5L0 11.1l10.4-1.5z"/>
    </g>

    <!-- fone de ouvido -->
    <g transform="translate(100,172)">
      <path d="M0 18v-4a15 15 0 0 1 30 0v4"/>
      <rect x="0" y="16" width="8" height="12" rx="3"/>
      <rect x="22" y="16" width="8" height="12" rx="3"/>
    </g>

    <!-- pin de localizacao -->
    <g transform="translate(180,168)">
      <path d="M12 32S24 20 24 12A12 12 0 0 0 0 12c0 8 12 20 12 20z"/>
      <circle cx="12" cy="12" r="4.5"/>
    </g>

    <!-- presente -->
    <g transform="translate(268,170)">
      <rect x="0" y="9" width="30" height="21" rx="2"/>
      <path d="M0 16h30M15 9v21"/>
      <path d="M15 9C11 9 6 8 6 4.5A4.5 4.5 0 0 1 15 4a4.5 4.5 0 0 1 9 .5C24 8 19 9 15 9z"/>
    </g>

    <!-- livro -->
    <g transform="translate(28,240)">
      <path d="M0 3a3 3 0 0 1 3-3h12a5 5 0 0 1 5 5v22a4 4 0 0 0-4-4H0z"/>
      <path d="M40 3a3 3 0 0 0-3-3H25a5 5 0 0 0-5 5v22a4 4 0 0 1 4-4h16z"/>
    </g>

    <!-- sino -->
    <g transform="translate(112,240)">
      <path d="M2 20V11a10 10 0 0 1 20 0v9l3 5H-1z"/>
      <path d="M9 29a3 3 0 0 0 6 0"/>
    </g>

    <!-- carrinho -->
    <g transform="translate(178,244)">
      <path d="M0 0h5l4 17h19l4-12H11"/>
      <circle cx="12" cy="24" r="3"/>
      <circle cx="26" cy="24" r="3"/>
    </g>

    <!-- guarda-chuva -->
    <g transform="translate(268,240)">
      <path d="M0 14a15 15 0 0 1 30 0z"/>
      <path d="M15 14v13a4 4 0 0 1-8 0"/>
    </g>

    <!-- smiley -->
    <g transform="translate(34,306)">
      <circle cx="14" cy="14" r="14"/>
      <path d="M8 18a7 7 0 0 0 12 0"/>
      <path d="M9 10v.01M19 10v.01"/>
    </g>

    <!-- calendario -->
    <g transform="translate(110,308)">
      <rect x="0" y="3" width="30" height="26" rx="3"/>
      <path d="M0 11h30M8 0v6M22 0v6"/>
    </g>

    <!-- clipe -->
    <g transform="translate(184,304)">
      <path d="M20 8L8 20a6 6 0 0 0 8 8l12-12a10 10 0 0 0-14-14L2 14"/>
    </g>

    <!-- telefone -->
    <g transform="translate(268,306)">
      <path d="M3 2h7l3 8-4 3a17 17 0 0 0 8 8l3-4 8 3v7a3 3 0 0 1-3 3A25 25 0 0 1 0 5a3 3 0 0 1 3-3z"/>
    </g>

  </g>
</svg>
