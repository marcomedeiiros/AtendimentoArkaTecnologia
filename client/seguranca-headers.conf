# CABECALHOS DE SEGURANCA DO DOCUMENTO HTML.
#
# ── POR QUE ESTES CABECALHOS PRECISAM ESTAR AQUI, E NAO SO NO EXPRESS ──────
#
# O Express manda os mesmos cabecalhos (helmet, em src/app.js), e por um tempo
# parecia que bastava. Nao basta, e a razao e a topologia:
#
#   /api/...  -> proxy para o Express   (cabecalho do helmet chega)
#   /         -> ESTE nginx serve o index.html   (o helmet nem e consultado)
#
# A CSP protege o DOCUMENTO: e ela que diz de onde a pagina pode carregar
# script. Numa resposta JSON de API ela nao tem quase nenhum efeito. Como quem
# entrega o HTML e o nginx, uma CSP so no Express seria teatro -- ficaria escrito
# "temos CSP" e o painel continuaria sem nenhuma.
#
# O Express mantem os dele para as respostas de API, que tambem podem ser
# acessadas direto. Aqui e onde a protecao do painel de fato mora.
#
# ── POR QUE UM ARQUIVO SEPARADO ───────────────────────────────────────────
#
# No nginx, um bloco que declara QUALQUER `add_header` proprio PERDE todos os
# `add_header` herdados. O `location /assets/` declara o Cache-Control -- se
# estes cabecalhos ficassem so no `server`, os arquivos servidos dali sairiam
# sem nenhum deles. Como include, eles sao repetidos onde precisam, sem copiar
# e colar (que e como duas copias comecam a divergir).
#
# `always` faz o cabecalho valer inclusive nas respostas de erro (404, 500) --
# sem ele, uma pagina de erro sairia sem CSP.
#
# Cada permissao da CSP esta explicada em server/src/app.js. As duas listas
# PRECISAM concordar, e ha um teste que compara as duas:
#
#   cd server && node verificar-cabecalhos.js

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://challenges.cloudflare.com; upgrade-insecure-requests" always;

# Clickjacking, para navegador antigo que ignora frame-ancestors.
add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS: 180 dias. Quem termina o HTTPS e a Cloudflare, na frente deste nginx.
#
# Sem `preload` de proposito: entrar na lista de preload dos navegadores e
# praticamente irreversivel, e passa a valer para TODOS os subdominios --
# incluindo algum interno que ainda fale HTTP e pararia de abrir.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
