# O formato padrao do nginx registra $request, que inclui a query string -- e o
# token do webhook viaja justamente ali (?token=...), acabando gravado em texto
# puro no log de acesso. Este formato usa $uri, que e o caminho sem a query.
log_format arka_sem_query
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log arka_sem_query;

    # Cabecalhos de seguranca do HTML. Ver o proprio arquivo: eles precisam
    # estar AQUI porque quem entrega o index.html e o nginx, e nao o Express.
    include /etc/nginx/conf.d/seguranca-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # O Express aceita JSON de ate 30mb (midia chega em base64). O nginx
    # precisa de folga sobre isso, senao devolve 413 antes de a API ver o envio.
    client_max_body_size 32m;

    # DNS interno do Docker. Sem ele o nginx resolveria "api" uma unica vez, no
    # boot, e guardaria o IP para sempre -- bastava um `restart api` (que troca
    # o IP do container) para o painel ficar em 502 ate o nginx ser recarregado.
    # Com o resolver + a variavel abaixo, o nome e resolvido a cada requisicao.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $arka_api http://api:3000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # SSE: o painel mantem uma conexao aberta aqui para receber mensagem em
    # tempo real. Precisa de buffering desligado (senao o nginx segura os
    # eventos ate encher o buffer) e sem timeout de leitura curto.
    # Tem de vir ANTES do bloco /api/, por ser um prefixo mais especifico.
    # ------------------------------------------------------------------
    location /api/conversas/stream {
        proxy_pass $arka_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass $arka_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # A aplicacao monta o webhook em dois caminhos: /api/webhook/v1/whatsapp e
    # /webhook/v1/whatsapp. Sem este bloco o segundo caia no SPA e respondia 405,
    # entao quem configurasse a Evolution com ele veria as mensagens sumirem sem
    # erro nenhum no back-end.
    location /webhook/ {
        proxy_pass $arka_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Documentacao Swagger e healthcheck, uteis para diagnostico na VM.
    location /api-docs {
        proxy_pass $arka_api;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass $arka_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # Os assets do Vite tem hash no nome: podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repetido: declarar um add_header aqui descarta os herdados do server.
        include /etc/nginx/conf.d/seguranca-headers.conf;
    }

    # O INDEX.HTML NAO PODE SER CACHEADO.
    #
    # Ele e o UNICO arquivo sem hash no nome, e e ele que aponta para os bundles
    # que tem hash. Aqui nao havia Cache-Control nenhum -- e "nenhum" nao
    # significa "nao cacheia": sem o cabecalho, o navegador aplica cache
    # HEURISTICO e reaproveita o index.html por conta propria, tipicamente ~10%
    # do tempo desde o Last-Modified. Na pratica, depois de cada deploy do front
    # o operador seguia carregando o JavaScript antigo, e a correcao "so
    # aparecia" com Ctrl+Shift+R.
    #
    # Isso custou horas de diagnostico em 2026-08-28: badge que nao trocava,
    # conversa que so mudava de aba no F5 -- tudo com o servidor e o banco
    # certos, e a tela rodando o bundle da versao anterior.
    #
    # `no-cache` nao e "nunca guarde": e "guarde, mas revalide SEMPRE antes de
    # usar". Com o ETag que o nginx ja manda, a revalidacao devolve 304 e custa
    # um round-trip minusculo; quando o deploy troca o arquivo, vem 200 com o
    # index novo -- e o novo aponta para os bundles novos.
    #
    # Os /assets/ seguem `immutable`: eles TEM hash, e por isso podem (e devem)
    # ser cacheados para sempre.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # Repetido de proposito: declarar um add_header aqui descarta os
        # herdados do bloco server (mesma pegadinha comentada em /assets/).
        include /etc/nginx/conf.d/seguranca-headers.conf;
    }

    # SPA (react-router): qualquer rota desconhecida devolve o index.html,
    # senao um F5 em /whatsapp ou /login daria 404. O fallback e um redirect
    # INTERNO, entao ele reentra no `location = /index.html` acima e herda o
    # no-cache -- sem isso, /whatsapp continuaria servindo index.html cacheado.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
