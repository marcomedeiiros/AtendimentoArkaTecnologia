# Stack completa do Arka para a VM: painel, API, Evolution e o Postgres da
# Evolution. Um unico comando sobe tudo e o Docker religa sozinho no boot.
#
#   subir:      docker compose -f docker-compose.prod.yml up -d --build
#   logs:       docker compose -f docker-compose.prod.yml logs -f api
#   parar:      docker compose -f docker-compose.prod.yml down
#
# Os segredos vem do arquivo .env desta pasta (copie de .env.example). Ele nao
# vai para o git.
name: arka-chat

# ── TETO PARA O LOG, PORQUE SEM ELE NAO HA NENHUM ───────────────────────────
#
# O driver padrao do Docker (`json-file`) escreve sem limite: o arquivo de log
# de cada container so cresce, para sempre. Num disco de 48 GB que ja carrega
# backups e cache de build, isso e um cronometro -- e quando o disco enche, o
# Postgres para de escrever e a API para de responder. A stack inteira cai por
# causa de texto.
#
# O risco nao e teorico aqui: em 05/09/2026 a reconexao girou em falso por 6h30
# escrevendo 4 linhas de log a cada ~60s, e `LOG_BAILEYS=warn` na Evolution
# soma o trafego do socket. Um incidente longo e justamente quando o log cresce
# mais depressa -- ou seja, o pior momento possivel para o disco encher.
#
# 20 MB x 5 arquivos = teto de 100 MB por container, 400 MB na stack. Suficiente
# para investigar dias de historico, e um numero que nao surpreende ninguem.
#
# YAML anchor para nao repetir quatro vezes: o `<<: *log` em cada servico e a
# mesma configuracao, e mudar aqui muda em todos.
x-log: &log
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ------------------------------------------------------------------------
  # Painel React ja buildado, servido pelo nginx. E a unica porta publicada
  # para a rede: tudo o mais conversa pela rede interna do compose.
  # ------------------------------------------------------------------------
  web:
    build: ./client
    container_name: arka-web
    logging: *log
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started

  # ------------------------------------------------------------------------
  # API Node/Express. Nao publica porta: quem fala com ela e o nginx do painel
  # (http://api:3000) e a Evolution, ambos pela rede interna.
  # ------------------------------------------------------------------------
  api:
    build: ./server
    container_name: arka-api
    logging: *log
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Banco no volume, fora da imagem: sobrevive a rebuild e update.
      DATABASE_URL: "file:/data/arka.db"
      # Nome do servico na rede do compose -- nao e localhost aqui dentro.
      EVOLUTION_API_URL: "http://evolution-api:8080"
      # QUANTOS PROXIES ESTAO NA FRENTE, de fora para dentro.
      #
      # Sao DOIS: Cloudflare (termina o HTTPS) e o nginx do container `web`.
      # Estava "1", contando so o nginx -- com um hop a menos o Express le a
      # cadeia errada e enxerga o IP da BORDA DA CLOUDFLARE como se fosse o do
      # cliente, e todo mundo que passa pela mesma borda cai no MESMO balde de
      # rate limit.
      #
      # Medido: com a cadeia "cliente, borda-cf",
      #   TRUST_PROXY=1 -> req.ip = borda-cf   (errado)
      #   TRUST_PROXY=2 -> req.ip = cliente    (correto)
      #
      # Se a Cloudflare sair da frente, isto volta a ser "1".
      TRUST_PROXY: "2"
      # Midia no mesmo volume do banco: /app nao e gravavel pelo usuario node,
      # e sem isto o boot loga "EACCES ... mkdir '/app/dados'" e o envio de
      # audio/imagem falha.
      MEDIA_DIR: "/data/midia"
      # Fuso de Brasilia no container. O servidor tambem assume esse padrao no
      # codigo (src/server.js), mas declarar aqui deixa explicito no deploy --
      # sem isto o log sai em UTC e a hora local do processo fica 3h adiantada.
      TZ: "America/Sao_Paulo"

      # COFRE DA SESSAO DO WHATSAPP -- ver server/src/modules/whatsapp/whatsapp.sessao.js.
      #
      # A Evolution 2.4.0-rc2 APAGA a credencial do pareamento num timeout de
      # rede (statusCode 408 entrou em `codesToNotReconnect` e o ramo emite
      # `logout.instance`, que roda `session.deleteMany`). Sem cofre, uma queda
      # de internet custa um QR novo.
      #
      # Com estas duas variaveis a API copia a credencial enquanto tudo esta bem
      # e a devolve quando o WhatsApp NAO deslogou de verdade. Sem elas o modulo
      # se declara inativo e o resto do vigia continua funcionando normalmente.
      EVOLUTION_DB_URL: "postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public"
      # Onde a Evolution guarda as chaves do Signal (INSTANCE_DIR = /evolution/instances).
      # Montado abaixo em modo leitura+escrita porque o cofre tambem restaura.
      EVOLUTION_INSTANCES_DIR: "/evolution-instances"
    volumes:
      - arka_data:/data
      - ./backups:/backups
      # Mesmo volume que a Evolution usa. O cofre precisa dele para copiar e
      # devolver as chaves do Signal junto com a credencial.
      - evolution_instances:/evolution-instances
    depends_on:
      evolution-api:
        condition: service_started
      evolution-db:
        condition: service_healthy

  # ------------------------------------------------------------------------
  # Evolution API: ponte com o WhatsApp (le o QR e entrega as mensagens).
  # A porta so escuta em 127.0.0.1, entao o /manager dela nao fica exposto na
  # rede -- para abrir do seu PC use um tunel SSH (veja DEPLOY.md).
  # ------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:2.4.0-rc2
    container_name: arka-evolution
    logging: *log
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: "http://${VM_IP}:8080"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY}"
      AUTHENTICATION_TYPE: "apikey"

      # Licenciamento, exigido a partir da 2.4.0. Sem ativacao a Evolution
      # recusa TODA requisicao com 503 LICENSE_REQUIRED -- inclusive as do
      # proprio /manager, que por isso nao consegue nem mostrar a tela de
      # ativacao. O tier `community` e gratuito: sem limite de instancias, sem
      # limite de mensagens, sem recurso bloqueado; a ativacao serve a
      # telemetria (heartbeat a cada 5 min) e tolera queda de rede depois.
      #
      # Com o e-mail JA registrado uma vez pelo navegador, a subida chama
      # /v1/register/auto sozinha e o container nasce ativado -- sem /manager e
      # sem janela de indisponibilidade. Isso importa aqui porque o fluxo pelo
      # navegador NAO fecha nesta topologia: a porta so escuta em 127.0.0.1 e
      # o SERVER_URL abaixo nao e alcancavel de fora da VM.
      #
      # Inofensivo na v2.3.7, que simplesmente ignora a variavel. O `:-` deixa
      # o compose subir com ela ausente do .env.
      EVOLUTION_OPERATOR_EMAIL: "${EVOLUTION_OPERATOR_EMAIL:-}"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: "arka"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      DEL_INSTANCE: "false"

      # 3, NAO 30 -- e um limite de SEGURANCA, nao de conveniencia.
      #
      # Ao estourar o limite a Evolution nao para de emitir QR: ela chama
      # `client.logout()` (monitor.service.ts:435, via o evento `no.connection`),
      # que remove o aparelho DO LADO DO WHATSAPP. Com o Baileys renovando o QR
      # a cada ~20s, "30" significa que uma tela de QR esquecida aberta por ~10
      # minutos provoca um logout de verdade. Com 3, a tela expira em ~1 min e o
      # operador so precisa clicar em "Gerar QR" outra vez -- sem consequencia.
      QRCODE_LIMIT: "3"

      CONFIG_SESSION_PHONE_CLIENT: "Arka Tecnologia"
      CONFIG_SESSION_PHONE_NAME: "Chrome"

      # ERROR sozinho escondia exatamente a linha que diz POR QUE a conexao caiu
      # ("Connection closed, evaluating reconnection ... statusCode"), que a
      # Evolution loga em INFO. Sem ela, toda investigacao de queda virava
      # adivinhacao. LOG_BAILEYS=warn traz o `stream:error` sem despejar o
      # trafego inteiro do socket no log.
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_BAILEYS: "warn"

      # Webhook -> Arka. Na VM tudo esta na mesma rede do compose, entao o
      # destino e o nome do servico. (No setup local em Windows isso era
      # host.docker.internal, que aqui nao e mais necessario.)
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://api:3000/api/webhook/v1/whatsapp?token=${WEBHOOK_SECRET}"
      WEBHOOK_GLOBAL_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      # QR emitido sem ninguem ter pedido = o pareamento se perdeu. E o unico
      # aviso confiavel de que so o celular resolve, e sem ele o painel fica
      # eternamente em "Conectando" sem contar a ninguem o que falta.
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_BASE64: "true"
    volumes:
      - evolution_instances:/evolution/instances
    # Saber se o processo esta VIVO, separado de saber se o WhatsApp esta
    # conectado -- sao duas falhas diferentes e ate agora nada distinguia as
    # duas: "Offline" no painel tanto podia ser a Evolution morta quanto a
    # sessao caida. `GET /` nao exige apikey e responde 200 com a versao.
    #
    # E so sinalizacao: nada depende de `service_healthy` da Evolution, entao
    # um health vermelho aparece no `docker compose ps` sem derrubar ninguem.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------------------
  # Postgres exclusivo da Evolution (instancias, contatos, chats). Nao publica
  # porta: e privado da stack.
  # ------------------------------------------------------------------------
  evolution-db:
    image: postgres:16-alpine
    container_name: arka-evolution-db
    logging: *log
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: "${EVOLUTION_DB_PASSWORD}"
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Banco SQLite do Arka (conversas, contatos, usuarios). E o volume que o
  # deploy/backup.sh copia -- o unico com dado insubstituivel.
  arka_data:
  # Sessao pareada do WhatsApp: perder isso significa escanear o QR de novo.
  evolution_instances:
  evolution_pg:
