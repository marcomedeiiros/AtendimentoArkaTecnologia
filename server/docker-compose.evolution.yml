# Evolution API rodando LOCALMENTE, na mesma maquina que o Arka.
#
#   subir:   docker compose -f docker-compose.evolution.yml up -d
#   logs:    docker compose -f docker-compose.evolution.yml logs -f evolution-api
#   parar:   docker compose -f docker-compose.evolution.yml down
#   zerar:   docker compose -f docker-compose.evolution.yml down -v   (apaga a sessao do WhatsApp)
#
# As chaves NAO ficam neste arquivo: o Compose le automaticamente o server/.env
# (mesma pasta), entao .env e compose nunca saem de sincronia e este YAML pode
# ser versionado sem vazar segredo.
# Rodando local, nao e preciso tunel: o webhook usa host.docker.internal para
# alcancar o back-end na porta 3000 da sua maquina.
services:
  evolution-api:
    # A imagem antiga (atendai/evolution-api) foi despublicada do Docker Hub;
    # o projeto agora e distribuido em evoapicloud/evolution-api.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: arka-evolution
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: "http://localhost:8080"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY}"
      AUTHENTICATION_TYPE: "apikey"

      # A v2 usa Postgres para guardar instancias/mensagens. O banco sobe junto,
      # isolado do Postgres do Arka (nao expoe porta para nao conflitar).
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution@evolution-db:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: "arka"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      # Nao remove a instancia sozinha se a conexao cair.
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: "Arka Tecnologia"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      LOG_LEVEL: "ERROR"

      # Webhook global -> Arka. De dentro do container, o seu PC e
      # 'host.docker.internal'; 'localhost' apontaria pro proprio container.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://host.docker.internal:3000/api/webhook/v1/whatsapp?token=${WEBHOOK_SECRET}"
      WEBHOOK_GLOBAL_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      # Manda a midia ja em base64 no evento (imagem/audio chegam prontos).
      WEBHOOK_BASE64: "true"
    volumes:
      - evolution_instances:/evolution/instances
    extra_hosts:
      - "host.docker.internal:host-gateway"

  evolution-db:
    image: postgres:16-alpine
    container_name: arka-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evolution_instances:
  evolution_pg:
